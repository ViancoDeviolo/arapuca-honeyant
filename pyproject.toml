[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "honeyant"
version = "0.1.0"
description = "Arapuca HoneyAnt - Ferramenta open source de segurança para casas inteligentes"
authors = [
    { name = "Equipe Arapuca" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-fuzzy>=0.4.2",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["test_*.py"]
