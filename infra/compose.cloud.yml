# Isca na EC2. Uso: docker compose -f infra/compose.cloud.yml up -d --build
name: honeyant-nuvem

services:
  init-dados:
    # Roda uma vez: dá ao usuário da isca (10001) a posse do volume de dados.
    # O diretório fica 2775 (grupo 10001 cria arquivos; setgid mantém o grupo) porque
    # leitores em mode=ro de outro usuário do grupo precisam recriar o -shm/-wal depois
    # que a isca desliga. O arquivo isca.db continua 0644: só a isca escreve nele.
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /dados && chmod 2775 /dados"]
    volumes:
      - dados:/dados
    restart: "no"

  isca:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.isca
    image: honeyant-isca:local
    depends_on:
      init-dados:
        condition: service_completed_successfully
    ports:
      - "23:2323"
      - "1883:18830"
    volumes:
      - dados:/dados
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dados:
