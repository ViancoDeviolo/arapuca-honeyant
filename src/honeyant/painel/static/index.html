<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoneyAnt · Formigueiro</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/painel.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <header class="topo">
    <div class="marca">
      <h1>HoneyAnt</h1>
      <p class="subtitulo">Rotas de invasão previstas para a casa inteligente</p>
    </div>
    <div class="estado">
      <p id="selo" class="selo selo-vulneravel">Vulnerável</p>
      <p id="atualizado" class="atualizado">Carregando dados da isca…</p>
    </div>
  </header>

  <section class="controles" aria-label="Controles da simulação">
    <button id="prever" class="botao botao-primario" type="button" disabled>Prever invasão</button>
    <fieldset class="velocidade">
      <legend>Velocidade</legend>
      <div class="segmentos">
        <input type="radio" name="velocidade" id="vel-025" value="0.25"><label for="vel-025">0,25×</label>
        <input type="radio" name="velocidade" id="vel-05" value="0.5"><label for="vel-05">0,5×</label>
        <input type="radio" name="velocidade" id="vel-1" value="1" checked><label for="vel-1">1×</label>
        <input type="radio" name="velocidade" id="vel-2" value="2"><label for="vel-2">2×</label>
        <input type="radio" name="velocidade" id="vel-4" value="4"><label for="vel-4">4×</label>
      </div>
    </fieldset>
    <p id="status" class="status" role="status">Carregando a casa…</p>
  </section>

  <main class="principal">
    <figure class="cena" id="cena">
      <div class="quadro">
      <svg id="formigueiro" viewBox="0 0 1000 640" role="img"
           aria-labelledby="titulo-cena" preserveAspectRatio="xMidYMid meet">
        <title id="titulo-cena">Rede de túneis da casa vista de cima: cada entrada é um dispositivo e cada túnel é um caminho de invasão</title>
        <defs>
          <filter id="f-brilho" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="840">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="fundo"></g>
        <g id="tuneis"></g>
        <g id="rota-sentido"></g>
        <g id="formigas"></g>
        <g id="entradas"></g>
      </svg>
      </div>
      <figcaption class="legenda">
        <ul>
          <li>
            <svg class="amostra" viewBox="0 0 40 16" aria-hidden="true"><path class="amostra-tunel" d="M2 8 H38"/></svg>
            Túnel: mais largo onde as formigas mais passam
          </li>
          <li>
            <svg class="amostra" viewBox="0 0 40 16" aria-hidden="true"><path class="amostra-rota" d="M2 8 H38"/><path class="amostra-seta" d="M17 4 L23 8 L17 12"/></svg>
            Rota prevista até a fechadura
          </li>
          <li>
            <svg class="amostra" viewBox="0 0 40 16" aria-hidden="true"><path class="amostra-bloqueado" d="M2 8 H38"/><use href="/static/icones.svg#cadeado" x="14" y="2" width="12" height="12" class="amostra-cadeado"/></svg>
            Túnel bloqueado
          </li>
          <li>
            <svg class="amostra" viewBox="0 0 40 16" aria-hidden="true"><rect class="formiga formiga-aco" x="16.5" y="4.5" width="7" height="7"/></svg>
            Formiga do ACO explorando um caminho
          </li>
          <li>
            <svg class="amostra" viewBox="0 0 40 16" aria-hidden="true"><rect class="formiga formiga-ataque" x="15.5" y="3.5" width="9" height="9"/></svg>
            Ataque real recebido pela isca
          </li>
          <li>
            <svg class="amostra" viewBox="0 0 40 16" aria-hidden="true"><path class="amostra-fundo" d="M2 12 H20 V4 H38"/></svg>
            Túneis de fundo (só decoração)
          </li>
        </ul>
      </figcaption>
    </figure>

    <aside id="lateral" class="lateral" aria-label="Detalhes da rota">
      <section class="cartao">
        <h2>Rota prevista</h2>
        <ol id="passos" class="passos"></ol>
        <p id="ponto-fraco" class="ponto-fraco"></p>
      </section>
    </aside>
  </main>

  <p id="anuncio" class="so-leitor" aria-live="polite"></p>
</body>
</html>
