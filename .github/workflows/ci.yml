name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5

      - name: Instalar dependências (uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatação (ruff)
        run: uv run ruff format --check .

      - name: Regra de dependência entre módulos (import-linter)
        run: uv run lint-imports

      - name: Análise estática de segurança (bandit)
        run: uv run bandit -c pyproject.toml -r src

      - name: Testes
        run: uv run pytest -m "not integration" -v
