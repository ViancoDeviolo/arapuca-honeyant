name: CI & Security

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Essencial para carregar todo o histórico e evitar o erro do Gitleaks

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências e ferramentas de teste
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"  # Instala o pacote com dependências opcionais (pytest, ruff, etc.)

      - name: Executar testes
        run: |
          python -m pytest  # Executa os testes de forma segura via módulo Python

      - name: Varredura Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
